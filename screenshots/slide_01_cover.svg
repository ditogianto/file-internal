<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1928"/>
      <stop offset="100%" stop-color="#0a101b"/>
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1920" height="1080" fill="url(#bg1)"/>

  <!-- Tactical Grid Coordinate Overlay -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 120 L 1920 120 M 0 240 L 1920 240 M 0 360 L 1920 360 M 0 480 L 1920 480 M 0 600 L 1920 600 M 0 720 L 1920 720 M 0 840 L 1920 840 M 0 960 L 1920 960"/>
    <path d="M 240 0 L 240 1080 M 480 0 L 480 1080 M 720 0 L 720 1080 M 960 0 L 960 1080 M 1200 0 L 1200 1080 M 1440 0 L 1440 1080 M 1680 0 L 1680 1080"/>
  </g>

  <!-- Left Accent Bar -->
  <rect x="100" y="220" width="8" height="440" rx="4" fill="#10b981"/>

  <!-- Hero Content -->
  <g transform="translate(140, 220)">
    <!-- Top Badge -->
    <rect x="0" y="0" width="560" height="34" rx="6" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2"/>
    <text x="16" y="22" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10b981" letter-spacing="2">
      ★ KARTIKA CYBER HACKATHON 2026 // PUSSIBERAD TNI AD × CODEPOLITAN
