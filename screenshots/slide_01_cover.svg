    <text x="110" y="214" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      KATEGORI: PENANGKALAN
    </text>

    <!-- Pitch Narrative -->
    <text x="0" y="260" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" fill="#94a3b8" width="1000">
      <tspan x="0" dy="0">Platform Pertahanan Siber Aktif, Kontra-Spionase Internal, dan Pelumpuh Instrumen Lawan</tspan>
      <tspan x="0" dy="28">Terintegrasi IT/OT untuk Mengamankan Satuan Teritorial Tentara Nasional Indonesia Angkatan Darat.</tspan>
    </text>

    <!-- Core Doctrine Text -->
    <text x="0" y="360" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="600" fill="#f59e0b">
      DOKTRIN: "Membangun Pondasi yang Kebal Terhadap Human Error, Memasang Lonceng Asimetris &amp; Stempel Kriptografis Lawan"
    </text>
  </g>

  <!-- 4 Key Strategic Value Cards (Bottom Strip) -->
  <g transform="translate(100, 780)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="405" height="130" rx="10" fill="url(#card1)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow1)"/>
