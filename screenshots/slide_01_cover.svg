      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#10b981">BY-DESIGN ZERO FP</text>
      <text x="24" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Akurasi Deterministik Ranjau</text>
      <text x="24" y="92" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Hanya bereaksi saat ranjau disentuh musuh.</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(438, 0)">
      <rect width="405" height="130" rx="10" fill="url(#card1)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow1)"/>
      <rect x="0" y="0" width="405" height="4" fill="#06b6d4"/>
      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#06b6d4">ACTIVE TARPIT CRASHER</text>
      <text x="24" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Starvasi Scanner &lt; 0.5 req/s</text>
      <text x="24" y="92" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Menahan TCP Window &amp; menguras soket VPN musuh.</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(876, 0)">
      <rect width="405" height="130" rx="10" fill="url(#card1)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow1)"/>
      <rect x="0" y="0" width="405" height="4" fill="#f59e0b"/>
      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#f59e0b">100% AIR-GAP ON-PREMISE</text>
      <text x="24" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Mandiri Tanpa Cloud Asing</text>
      <text x="24" y="92" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Siap beroperasi di PC standar Kodim terisolasi.</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(1314, 0)">
      <rect width="405" height="130" rx="10" fill="url(#card1)" stroke="#ef4444" stroke-width="1.5" filter="url(#shadow1)"/>
      <rect x="0" y="0" width="405" height="4" fill="#ef4444"/>
      <text x="24" y="38" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="900" fill="#ef4444">SHA-256 MILITARY SITREP</text>
      <text x="24" y="65" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Alat Bukti Sah POMAD</text>
      <text x="24" y="92" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">Laporan situasi bersegel hukum digital &lt; 1 detik.</text>
    </g>
