    <!-- Subtitle -->
    <text x="4" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="30" font-weight="700" fill="#06b6d4" letter-spacing="1">
      Network Deception &amp; Active Tarpit Platform
