      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg4)"/>

  <!-- Tactical Grid -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 120 L 1920 120 M 0 240 L 1920 240 M 0 360 L 1920 360 M 0 480 L 1920 480 M 0 600 L 1920 600 M 0 720 L 1920 720 M 0 840 L 1920 840 M 0 960 L 1920 960"/>
    <path d="M 240 0 L 240 1080 M 480 0 L 480 1080 M 720 0 L 720 1080 M 960 0 L 960 1080 M 1200 0 L 1200 1080 M 1440 0 L 1440 1080 M 1680 0 L 1680 1080"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#38bdf8" text-anchor="middle">⚡</text>
    <text x="64" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="2">
      ARSITEKTUR TEKNIS // PUSSIBERAD TNI AD
    </text>
    <text x="64" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
