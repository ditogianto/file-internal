      </text>

      <g transform="translate(0, 108)">
        <rect width="353" height="70" rx="6" fill="#1b0a0e" stroke="#ef4444" stroke-width="0.8"/>
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#fca5a5">OBJEKTIF STRATEGIS</text>
        <text x="14" y="44" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan x="14" dy="0">Menyediakan tindakan mitigasi seketika dan</tspan>
          <tspan x="14" dy="16">bukti hukum otentik bagi peradilan militer.</tspan>
        </text>
      </g>

      <g transform="translate(0, 200)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="0" dy="0" font-weight="700" fill="#38bdf8">• Karantina Host 1-Klik:</tspan>
          <tspan x="0" dy="20">  Memutus transmisi lateral host korban</tspan>
          <tspan x="0" dy="18">  ke seluruh subnet markas dalam &lt; 1 detik.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Sitrep Terstandar Otomatis:</tspan>
          <tspan x="0" dy="20">  Menyusun laporan kronologi taktis</tspan>
          <tspan x="0" dy="18">  siap diserahkan langsung ke Komandan.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Segel Kriptografis SHA-256:</tspan>
          <tspan x="0" dy="20">  Integritas rantai bukti (chain of custody)</tspan>
          <tspan x="0" dy="18">  terjamin tidak dapat dimanipulasi.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Ekspor Blacklist Firewall:</tspan>
          <tspan x="0" dy="20">  Menerbitkan aturan blokir iptables &amp; netsh</tspan>
          <tspan x="0" dy="18">  untuk disinkronkan ke seluruh Kodim.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- Slide Footer Navigation Indicator -->
