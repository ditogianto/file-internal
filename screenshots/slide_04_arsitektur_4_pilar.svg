  <!-- 4 COLUMNS / PILLARS -->

  <!-- PILAR 1: OT/ICS DECOY -->
  <g transform="translate(100, 190)">
    <rect width="405" height="730" rx="14" fill="url(#card4)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect x="0" y="0" width="405" height="6" rx="3" fill="#10b981"/>

    <g transform="translate(26, 32)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="90" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">
        PILAR 1: RANJAU OT
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
        Modbus OT/ICS Decoy
      </text>
      <text x="0" y="80" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#10b981">
        Emulasi Genset &amp; Radar Port 502/5020
      </text>

      <g transform="translate(0, 108)">
        <rect width="353" height="70" rx="6" fill="#061510" stroke="#10b981" stroke-width="0.8"/>
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#6ee7b7">OBJEKTIF STRATEGIS</text>
        <text x="14" y="44" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan x="14" dy="0">Melindungi infrastruktur fisik pangkalan dari</tspan>
          <tspan x="14" dy="16">sabotase siber industri tanpa autentikasi.</tspan>
        </text>
      </g>

      <g transform="translate(0, 200)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="0" dy="0" font-weight="700" fill="#38bdf8">• Emulasi Protokol Nyata:</tspan>
          <tspan x="0" dy="20">  Merespon paket Modbus FC 01, 03,</tspan>
          <tspan x="0" dy="18">  05, dan 16 secara realistis.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Efek Kamuflase Tinggi:</tspan>
          <tspan x="0" dy="20">  Scanner nmap / Metasploit mengira</tspan>
          <tspan x="0" dy="18">  menemukan PLC Schneider / Siemens asli.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Early Warning Tripwire:</tspan>
          <tspan x="0" dy="20">  Begitu probe pertama menyentuh port,</tspan>
          <tspan x="0" dy="18">  alarm Web Audio menyalak di War-Room.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Nol Risiko PLC Hang:</tspan>
          <tspan x="0" dy="20">  PLC fisik radar aman karena scanner</tspan>
          <tspan x="0" dy="18">  terbelokkan ke server tiruan isolasi.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- PILAR 2: STICKY TARPIT CRASHER -->
  <g transform="translate(538, 190)">
    <rect width="405" height="730" rx="14" fill="url(#card4)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow4)"/>
    <rect x="0" y="0" width="405" height="6" rx="3" fill="#06b6d4"/>

    <g transform="translate(26, 32)">
      <rect x="0" y="0" width="180" height="26" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <text x="90" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">
        PILAR 2: INTERDIKSI AKTIF
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#f8fafc">
        Sticky Tarpit Crasher
      </text>
      <text x="0" y="80" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#06b6d4">
        TCP Window Choking &amp; Socket Drain
      </text>

      <g transform="translate(0, 108)">
        <rect width="353" height="70" rx="6" fill="#061720" stroke="#06b6d4" stroke-width="0.8"/>
        <text x="14" y="24" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#67e8f9">OBJEKTIF STRATEGIS</text>
        <text x="14" y="44" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
          <tspan x="14" dy="0">Melumpuhkan scanner musuh dan menguras</tspan>
          <tspan x="14" dy="16">sumber daya terminal serang secara fisik.</tspan>
        </text>
      </g>

      <g transform="translate(0, 200)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="0" dy="0" font-weight="700" fill="#38bdf8">• Algoritma Choking TCP:</tspan>
          <tspan x="0" dy="20">  Mengunci TCP Window Size ke 1 byte.</tspan>
          <tspan x="0" dy="18">  Hanya kirim 1 byte per 10-15 detik.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Stratagem 25 (Reflexive 200 OK):</tspan>
          <tspan x="0" dy="20">  Percobaan sabotase/reset konsol dibalas</tspan>
          <tspan x="0" dy="18">  respon sukses palsu agar musuh lengah.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• FCrDNS Anti-Crawler Guard:</tspan>
          <tspan x="0" dy="20">  Verifikasi Googlebot vs Musuh Mimicry</tspan>
          <tspan x="0" dy="18">  mencegah false alarm pada mesin pencari.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Socket Exhaustion Musuh:</tspan>
          <tspan x="0" dy="20">  Koneksi TCP penyerang ditahan gantung</tspan>
          <tspan x="0" dy="18">  hingga alokasi VPS/VPN lawan terkuras.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- PILAR 3: CANARY TOKEN BINER -->
  <g transform="translate(976, 190)">
