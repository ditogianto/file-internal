          <tspan x="14" dy="16">dan melacak sarang fisik penyerang luar.</tspan>
        </text>
      </g>

      <g transform="translate(0, 200)">
        <text x="0" y="0" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="0" dy="0" font-weight="700" fill="#38bdf8">• Biner Asli OpenXML:</tspan>
          <tspan x="0" dy="20">  Disisipkan pada relasi biner dokumen</tspan>
          <tspan x="0" dy="18">  tanpa macro VBA (100% lolos EDR/AV).</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Mekanisme Sleep-to-Fire:</tspan>
          <tspan x="0" dy="20">  Aman saat tersimpan offline di flashdisk.</tspan>
          <tspan x="0" dy="18">  Saat dibuka di internet luar: MELEDAK!</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Atribusi Forensik Lengkap:</tspan>
          <tspan x="0" dy="20">  Mengambil IP Publik, ISP, Geolocation,</tspan>
          <tspan x="0" dy="18">  JA4 fingerprint, dan Hardware hash.</tspan>

          <tspan x="0" dy="32" font-weight="700" fill="#38bdf8">• Deteksi Pengkhianat Dalam:</tspan>
          <tspan x="0" dy="20">  Membongkar jalur kebocoran data rahasia</tspan>
          <tspan x="0" dy="18">  secara tak terbantahkan di ranah militer.</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- PILAR 4: KARANTINA & SITREP POMAD -->
  <g transform="translate(1414, 190)">
