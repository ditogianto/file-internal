          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#f59e0b">2. TARPIT COUNTER</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
            <tspan x="16" dy="0">Statistik pelumpuhan:</tspan>
            <tspan x="16" dy="18">Mencatat durasi soket</tspan>
            <tspan x="16" dy="18">tertahan, byte per detik,</tspan>
            <tspan x="16" dy="18">dan resource lawan habis.</tspan>
          </text>
        </g>

        <g transform="translate(527, 0)">
          <rect width="243" height="160" rx="8" fill="#09121a" stroke="#1e293b" stroke-width="1"/>
          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#ef4444">3. ISOLASI 1-KLIK</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
            <tspan x="16" dy="0">Tombol merah taktis</tspan>
            <tspan x="16" dy="18">memutus total koneksi</tspan>
            <tspan x="16" dy="18">host musuh tanpa reboot</tspan>
            <tspan x="16" dy="18">dalam waktu &lt; 1 detik.</tspan>
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- RIGHT: MILITARY SITREP DOSSIER & SHA-256 SEAL -->
  <g transform="translate(990, 190)">
    <rect width="830" height="730" rx="14" fill="url(#card6)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow6)"/>
    <rect x="0" y="0" width="830" height="6" rx="3" fill="#10b981"/>

