          </text>
        </g>

        <g transform="translate(527, 0)">
          <rect width="243" height="160" rx="8" fill="#09121a" stroke="#1e293b" stroke-width="1"/>
          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#06b6d4">3. EKSPOR INTELIJEN</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
