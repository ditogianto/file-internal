          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">1. MATRIX 64 UMPAN</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
            <tspan x="16" dy="0">Topologi visual real-time</tspan>
            <tspan x="16" dy="18">menampilkan node SCADA,</tspan>
            <tspan x="16" dy="18">Genset, Radar, dan Server</tspan>
            <tspan x="16" dy="18">Dinas dalam grid interaktif.</tspan>
          </text>
        </g>

        <g transform="translate(263, 0)">
