        </text>
      </g>

      <!-- Embedded / Framed UI Representation -->
      <g transform="translate(0, 70)">
        <!-- Window Frame Outer -->
        <rect width="770" height="420" rx="8" fill="#080c14" stroke="#1e293b" stroke-width="1.2"/>

        <!-- Real Screenshot Image -->
        <image href="04_siaga_merah_canary_dossier.png" x="2" y="2" width="766" height="416" preserveAspectRatio="xMidYMid slice" rx="6"/>

