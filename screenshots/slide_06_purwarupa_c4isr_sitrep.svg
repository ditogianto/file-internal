          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#10b981">1. RANTAI BUKTI SAH</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
