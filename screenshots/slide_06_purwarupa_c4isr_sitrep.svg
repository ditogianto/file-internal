          <text x="16" y="28" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#38bdf8">2. SEGEL SHA-256</text>
          <text x="16" y="52" font-family="'Segoe UI', sans-serif" font-size="11.5" fill="#cbd5e1">
            <tspan x="16" dy="0">Setiap sitrep dikunci</tspan>
            <tspan x="16" dy="18">dengan hash SHA-256 &amp;</tspan>
            <tspan x="16" dy="18">kunci HMAC on-premise,</tspan>
