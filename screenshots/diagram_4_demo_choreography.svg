    </g>

    <!-- [MENIT 3] -->
    <g transform="translate(24, 504)">
      <rect x="0" y="0" width="812" height="235" rx="10" fill="#080305" stroke="#dc2626" stroke-width="1.5"/>
      <text x="20" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#ef4444">
        root@adversary:~# ping 192.168.1.9  # [MONITOR DETAK KONEKSI INTRANET]
      </text>

      <g transform="translate(20, 50)" font-family="monospace" font-size="12">
