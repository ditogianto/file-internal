        </text>
        <text x="0" y="70" fill="#94a3b8">===============================================================</text>
        <text x="0" y="92" fill="#fca5a5" font-weight="700">
          [!] SOKET PENYERANG MENGALAMI STARVASI &amp; TIMEOUT! Thread terkunci di lem perekat Tarpit!
        </text>
