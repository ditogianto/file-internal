      <text x="20" y="28" font-family="monospace" font-size="13" font-weight="700" fill="#f59e0b">
        root@adversary:~# python3 01_recon_modbus.py 192.168.1.9 5020
      </text>

      <g transform="translate(20, 50)" font-family="monospace" font-size="12">
        <text x="0" y="0" fill="#94a3b8">[+] Koneksi TCP Handshake ke Port 5020 BERHASIL.</text>
        <text x="0" y="18" fill="#94a3b8">[>] Mengirim Probe Modbus Read Holding Registers (Function 0x03)...</text>
        <text x="0" y="36" fill="#38bdf8">[+] Respons Modbus Diterima (Function 0x03, Length: 6 bytes):</text>
        <text x="20" y="54" fill="#34d399">- Register 40001 (Tegangan Genset) : 380 V</text>
        <text x="20" y="70" fill="#34d399">- Register 40002 (Frekuensi Daya)  : 50 Hz</text>
        <text x="20" y="86" fill="#34d399">- Register 40003 (Level Tangki BBM): 85 %</text>
        <text x="0" y="106" fill="#fde68a" font-weight="700">
          [!] Target dikonfirmasi sebagai PLC Fasilitas Genset Pangkalan! (PENYERANG TERTIPU)
        </text>
      </g>
    </g>

    <!-- [MENIT 2] -->
