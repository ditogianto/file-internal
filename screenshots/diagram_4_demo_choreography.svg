    <path d="M 200 0 L 200 1080 M 400 0 L 400 1080 M 600 0 L 600 1080 M 800 0 L 800 1080 M 1000 0 L 1000 1080 M 1200 0 L 1200 1080 M 1400 0 L 1400 1080 M 1600 0 L 1600 1080 M 1800 0 L 1800 1080"/>
  </g>

