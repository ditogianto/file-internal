      <text x="63" y="34" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">MENIT 02</text>
      <text x="124" y="35" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="800" fill="#67e8f9">
