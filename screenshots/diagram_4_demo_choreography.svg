      <g transform="translate(20, 50)" font-family="monospace" font-size="12">
        <text x="0" y="0" fill="#94a3b8">===============================================================</text>
        <text x="0" y="16" fill="#cbd5e1">Starting gobuster in directory enumeration mode...</text>
        <text x="0" y="34" fill="#ef4444" font-weight="700">
          [!] PROGRES TERTURUN DRASTIS: [====&gt;.....................] 1/8 (SPEED: &lt; 0.50 REQ/SEC)
        </text>
        <text x="0" y="52" fill="#f87171">
