    <text x="22" y="28" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#10b981" text-anchor="middle">★</text>
    <text x="58" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#10b981" letter-spacing="2">
