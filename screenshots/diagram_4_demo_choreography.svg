        <text x="0" y="18" fill="#34d399">64 bytes from 192.168.1.9: icmp_seq=2 ttl=128 time=0.38 ms  (KONEKSI MASIH HIDUP)</text>
        <text x="0" y="40" fill="#fbbf24" font-weight="700">
          &gt;&gt; [KOMANDAN MENEKAN TOMBOL ISOLASI DI MEJA KOMANDO...]
        </text>
        <text x="0" y="62" fill="#ef4444" font-weight="700">From 192.168.1.88 icmp_seq=3 Destination Host Unreachable</text>
        <text x="0" y="80" fill="#ef4444" font-weight="700">Request timed out.</text>
        <text x="0" y="98" fill="#ef4444" font-weight="700">Request timed out.</text>
        <text x="0" y="122" fill="#f87171" font-weight="800">
          [-] KONEKSI PENYERANG PUTUS TOTAL! WORKSTATION TERISOLASI SECARA FISIK DARI INTRANET!
        </text>
