<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg2)"/>

  <!-- Grid overlay -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 120 L 1920 120 M 0 240 L 1920 240 M 0 360 L 1920 360 M 0 480 L 1920 480 M 0 600 L 1920 600 M 0 720 L 1920 720 M 0 840 L 1920 840 M 0 960 L 1920 960"/>
    <path d="M 240 0 L 240 1080 M 480 0 L 480 1080 M 720 0 L 720 1080 M 960 0 L 960 1080 M 1200 0 L 1200 1080 M 1440 0 L 1440 1080 M 1680 0 L 1680 1080"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#ef4444" text-anchor="middle">!</text>
    <text x="64" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#ef4444" letter-spacing="2">
      LATAR BELAKANG &amp; URGENSI STRATEGIS // PUSSIBERAD TNI AD
    </text>
    <text x="64" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      Paradoks Perimeter: "Furniture Mewah" di Atas Pondasi yang Rapuh
    </text>
    <text x="64" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
      Mengapa Firewall Miliaran Rupiah Gagal Saat Menghadapi "Hari Sial" Human Error &amp; Spionase Orang Dalam?
    </text>
  </g>

  <!-- LEFT COLUMN: THE PHILOSOPHY (ILUSI GEDUNG MEWAH VS HARI SIAL) -->
  <g transform="translate(100, 190)">
    <!-- Main Card Box -->
    <rect width="820" height="730" rx="14" fill="url(#card2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="820" height="6" rx="3" fill="#ef4444"/>

    <!-- Section Header -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="220" height="28" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1"/>
      <text x="110" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fca5a5" text-anchor="middle" letter-spacing="1">
        ANALOGI STRATEGIS MILITER
      </text>

      <text x="0" y="60" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">
        "Percuma Membeli Furniture Mewah Jika..."
      </text>
      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" width="750">
        Pondasi pertahanan kita rapuh, dan musuh justru merusak gedung dari dalam.
      </text>

      <!-- Comparison 1: Furniture Mewah vs Realita -->
      <g transform="translate(0, 125)">
        <rect width="750" height="135" rx="8" fill="#0b1019" stroke="#1e293b" stroke-width="1.2"/>
        <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#38bdf8">
          ILUSI SISTEM LAMA: "GEDUNG DENGAN FURNITURE MEWAH"
        </text>
        <text x="24" y="58" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1" width="700">
          <tspan x="24" dy="0">• Organisasi menghabiskan anggaran besar membeli Firewall Next-Gen &amp; SIEM termahal.</tspan>
          <tspan x="24" dy="22">• Sistem ini hanya menjaga gerbang luar, berasumsi siapa pun yang berada di dalam adalah 'orang suci'.</tspan>
          <tspan x="24" dy="22">• Kenyataannya: Sekali gerbang luar dilewati, intranet militer tidak memiliki penjaga ranjau sama sekali!</tspan>
        </text>
      </g>

      <!-- Comparison 2: Hari Sial (Human Error) -->
      <g transform="translate(0, 280)">
        <rect width="750" height="155" rx="8" fill="#170c10" stroke="#ef4444" stroke-width="1.2"/>
        <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ef4444">
          FAKTOR 'HARI SIAL' (HUMAN ERROR &amp; ANCAMAN ORANG DALAM)
        </text>
        <text x="24" y="58" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="24" dy="0">• Prajurit/staf administrasi bukan robot. Mereka manusia yang bisa mengalami "hari sial".</tspan>
          <tspan x="24" dy="22">• Cukup 1 detik khilaf mengunduh file APK jahat di WhatsApp (modus surat dinas/pinjol/judi online),</tspan>
          <tspan x="24" dy="22">  seluruh kredensial dinas dan sesi intranet pangkalan langsung tersedot ke tangan sindikat asing.</tspan>
          <tspan x="24" dy="22">• Belum lagi risiko spionase pengkhianat internal yang sengaja mencuri berkas dari dalam markas.</tspan>
        </text>
      </g>

      <!-- Comparison 3: Solusi yang Dibutuhkan -->
      <g transform="translate(0, 455)">
        <rect width="750" height="155" rx="8" fill="#081711" stroke="#10b981" stroke-width="1.2"/>
        <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#10b981">
          APA YANG DIBUTUHKAN PANGKALAN TNI AD HARI INI?
        </text>
        <text x="24" y="58" font-family="'Segoe UI', sans-serif" font-size="13" fill="#cbd5e1">
          <tspan x="24" dy="0">• Kita butuh sistem yang berasumsi bahwa 'HARI SIAL' PASTI AKAN TERJADI (Assumed Breach).</tspan>
          <tspan x="24" dy="22">• Saat musuh merayap di lorong markas, sistem harus MAMPU MEMASANG LONCENG pada musuh!</tspan>
          <tspan x="24" dy="22">• Saat dokumen rahasia dilarikan keluar, sistem harus MEMBERIKAN STEMPEL yang melacak</tspan>
          <tspan x="24" dy="22">  identitas peretas hingga ke sarangnya. Inilah fungsi strategis NEXUS-TRAP!</tspan>
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: THE HARD DATA (BUKTI EMPIRIS BSSN, MANDIANT, CISCO, CISA) -->
  <g transform="translate(960, 190)">
    <!-- Main Card Box -->
    <rect width="860" height="730" rx="14" fill="url(#card2)" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <rect x="0" y="0" width="860" height="6" rx="3" fill="#06b6d4"/>

    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="240" height="28" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <text x="120" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">
        LANDASAN DATA VALID &amp; RESMI
      </text>

      <text x="0" y="60" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="800" fill="#f8fafc">
        Kenyataan Pahit Pertahanan Konvensional
      </text>
      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="15" fill="#94a3b8">
        Empat fakta intelijen yang membuktikan bahwa pertahanan pasif telah kadaluarsa:
      </text>

      <!-- 4 Data Cards Grid (2x2) -->
      <!-- Data Card 1: BSSN RI -->
      <g transform="translate(0, 120)">
        <rect width="380" height="210" rx="8" fill="#0b1019" stroke="#ef4444" stroke-width="1.2"/>
        <rect x="0" y="0" width="380" height="3" fill="#ef4444"/>
        <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#ef4444">361 JUTA+</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Anomali Trafik Tahunan</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#f87171">SUMBER: BSSN RI Threat Report</text>
        <text x="20" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
          <tspan x="20" dy="0">Infostealer (RedLine, Stealc, Lumma)</tspan>
          <tspan x="20" dy="18">menjadi ancaman nomor 1 di instansi</tspan>
          <tspan x="20" dy="18">pemerintah &amp; militer via APK WhatsApp.</tspan>
        </text>
      </g>

      <!-- Data Card 2: MANDIANT DWELL TIME -->
      <g transform="translate(410, 120)">
        <rect width="380" height="210" rx="8" fill="#0b1019" stroke="#f59e0b" stroke-width="1.2"/>
        <rect x="0" y="0" width="380" height="3" fill="#f59e0b"/>
        <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#f59e0b">21 HARI</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Median Dwell Time (APAC)</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#fbbf24">SUMBER: Mandiant M-Trends 2024</text>
        <text x="20" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
          <tspan x="20" dy="0">Musuh bebas merayap selama 3 minggu</tspan>
          <tspan x="20" dy="18">di intranet tanpa terdeteksi karena</tspan>
          <tspan x="20" dy="18">memakai akun resmi prajurit (LotL)!</tspan>
        </text>
      </g>

      <!-- Data Card 3: CISCO ALERT FATIGUE -->
      <g transform="translate(0, 350)">
        <rect width="380" height="210" rx="8" fill="#0b1019" stroke="#06b6d4" stroke-width="1.2"/>
        <rect x="0" y="0" width="380" height="3" fill="#06b6d4"/>
        <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#06b6d4">54% ALERT</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Diabaikan Akibat Bising</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#38bdf8">SUMBER: Cisco &amp; Gartner SOC Report</text>
        <text x="20" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
          <tspan x="20" dy="0">Tim piket menerima 11.000 log/hari.</tspan>
          <tspan x="20" dy="18">Kelelahan alarm palsu (False Positive)</tspan>
          <tspan x="20" dy="18">membuat serangan asli lolos tak terpantau.</tspan>
        </text>
      </g>

      <!-- Data Card 4: CISA ICS MODBUS -->
      <g transform="translate(410, 350)">
        <rect width="380" height="210" rx="8" fill="#0b1019" stroke="#10b981" stroke-width="1.2"/>
        <rect x="0" y="0" width="380" height="3" fill="#10b981"/>
        <text x="20" y="32" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="#10b981">PORT 502</text>
        <text x="20" y="58" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Genset Pangkalan Zero-Auth</text>
        <text x="20" y="82" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#34d399">SUMBER: CISA ICS Industrial Advisory</text>
        <text x="20" y="112" font-family="'Segoe UI', sans-serif" font-size="12" fill="#94a3b8">
          <tspan x="20" dy="0">Modbus OT fasilitas pangkalan tidak</tspan>
          <tspan x="20" dy="18">memiliki enkripsi atau password. Siapa pun</tspan>
          <tspan x="20" dy="18">di subnet LAN bisa mematikan genset markas!</tspan>
        </text>
      </g>

      <!-- Bottom Strategic Quote -->
      <g transform="translate(0, 580)">
        <rect width="790" height="60" rx="6" fill="#0e1726" stroke="#1e293b" stroke-width="1"/>
        <text x="24" y="26" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#38bdf8">
          KESIMPULAN DOKTRIN MILITER:
        </text>
        <text x="24" y="46" font-family="'Segoe UI', sans-serif" font-size="12" fill="#cbd5e1">
          Pertahanan siber tidak boleh bergantung pada asumsi bahwa prajurit tidak akan pernah khilaf. Sistem harus kebal human error!
        </text>
      </g>
    </g>
  </g>

  <!-- Slide Footer Navigation Indicator -->
  <g transform="translate(100, 970)">
    <text x="0" y="15" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
      KCH-2026 // PUSSIBERAD TNI AD × CODEPOLITAN
    </text>
    <text x="1720" y="15" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">
      SLIDE 02 / 07
    </text>
  </g>
</svg>
