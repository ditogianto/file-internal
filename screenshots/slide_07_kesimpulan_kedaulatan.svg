<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="card7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg7)"/>

  <!-- Tactical Grid -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 120 L 1920 120 M 0 240 L 1920 240 M 0 360 L 1920 360 M 0 480 L 1920 480 M 0 600 L 1920 600 M 0 720 L 1920 720 M 0 840 L 1920 840 M 0 960 L 1920 960"/>
    <path d="M 240 0 L 240 1080 M 480 0 L 480 1080 M 720 0 L 720 1080 M 960 0 L 960 1080 M 1200 0 L 1200 1080 M 1440 0 L 1440 1080 M 1680 0 L 1680 1080"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#10b981" text-anchor="middle">★</text>
    <text x="64" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#10b981" letter-spacing="2">
      KESIMPULAN STRATEGIS // KEDAULATAN SIBER NASIONAL
    </text>
    <text x="64" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      Membangun Kemandirian Siber Pangkalan Tanpa Ketergantungan Asing
    </text>
    <text x="64" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
      Solusi Terukur Memperkokoh Pondasi Pertahanan Teritorial TNI AD dari Bahaya Spionase dan Kesalahan Manusiawi
    </text>
  </g>

  <!-- 4 STRATEGIC VALUE BLOCKS (2x2 GRID) -->

  <!-- CARD 1: KEDAULATAN AIR-GAP 100% -->
  <g transform="translate(100, 190)">
    <rect width="840" height="250" rx="14" fill="url(#card7)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="840" height="5" rx="2" fill="#10b981"/>

    <g transform="translate(30, 28)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="115" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">
        NILAI 1: AIR-GAP SOVEREIGNTY
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
        100% Mandiri Tanpa Ketergantungan Cloud Asing
      </text>
      <text x="0" y="88" font-family="'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1" width="780">
        <tspan x="0" dy="0">• NEXUS-TRAP tidak membutuhkan koneksi internet, lisensi cloud bulanan, atau server pihak ketiga.</tspan>
        <tspan x="0" dy="22">• Seluruh deteksi, emulasi protokol Modbus, tarpit, dan penandatanganan SHA-256 dieksekusi on-premise.</tspan>
        <tspan x="0" dy="22">• Menjamin kerahasiaan absolut: Doktrin operasional militer Indonesia tidak bocor ke telemetri luar negeri.</tspan>
      </text>
    </g>
  </g>

  <!-- CARD 2: EFISIENSI ANGGARAN & FLEKSIBILITAS -->
  <g transform="translate(980, 190)">
    <rect width="840" height="250" rx="14" fill="url(#card7)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="840" height="5" rx="2" fill="#38bdf8"/>

    <g transform="translate(30, 28)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
      <text x="115" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#7dd3fc" text-anchor="middle" letter-spacing="1">
        NILAI 2: COST EFFICIENCY
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
        Efisiensi Anggaran: Cukup PC Kantor Standar Kodim
      </text>
      <text x="0" y="88" font-family="'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1" width="780">
        <tspan x="0" dy="0">• Tidak memerlukan appliance hardware khusus seharga miliaran rupiah seperti solusi komersial barat.</tspan>
        <tspan x="0" dy="22">• Dirancang sangat ringan (RAM &lt; 250MB, CPU &lt; 1%) sehingga dapat berjalan di PC bekas kantor Kodim.</tspan>
        <tspan x="0" dy="22">• Memungkinkan gelar pertahanan terdistribusi di ratusan satuan teritorial tanpa membebani APBN.</tspan>
      </text>
    </g>
  </g>

  <!-- CARD 3: KETAHANAN HUMAN ERROR (ASSUMED BREACH) -->
  <g transform="translate(100, 470)">
    <rect width="840" height="250" rx="14" fill="url(#card7)" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="840" height="5" rx="2" fill="#f59e0b"/>

    <g transform="translate(30, 28)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
      <text x="115" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#fde68a" text-anchor="middle" letter-spacing="1">
        NILAI 3: RESILIENSI HUMAN ERROR
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
        Pondasi yang Kebal Terhadap "Hari Sial" Prajurit
      </text>
      <text x="0" y="88" font-family="'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1" width="780">
        <tspan x="0" dy="0">• Mengakhiri ketergantungan pada kesempurnaan manusia: Asumsikan infeksi APK atau USB pasti terjadi.</tspan>
        <tspan x="0" dy="22">• Saat musuh mencoba bergerak menyamping di intranet markas, musuh pasti tersandung ranjau umpan.</tspan>
        <tspan x="0" dy="22">• Memasang lonceng pada musuh sebelum mereka sempat menyentuh server komando atau data operasional.</tspan>
      </text>
    </g>
  </g>

  <!-- CARD 4: SENTRAL ATRIBUSI PUSSIBERAD -->
  <g transform="translate(980, 470)">
    <rect width="840" height="250" rx="14" fill="url(#card7)" stroke="#06b6d4" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="840" height="5" rx="2" fill="#06b6d4"/>

    <g transform="translate(30, 28)">
      <rect x="0" y="0" width="230" height="26" rx="4" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1"/>
      <text x="115" y="18" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#67e8f9" text-anchor="middle" letter-spacing="1">
        NILAI 4: THREAT INTELLIGENCE
      </text>

      <text x="0" y="58" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
        Sentral Atribusi &amp; Jaringan Intelijen Teritorial
      </text>
      <text x="0" y="88" font-family="'Segoe UI', sans-serif" font-size="13.5" fill="#cbd5e1" width="780">
        <tspan x="0" dy="0">• Mengubah data insiden lokal menjadi kekebalan nasional melalui ekspor feed IOC dan firewall otomatis.</tspan>
        <tspan x="0" dy="22">• Jejak pelaku (IP, JA4 hash, hardware profile) langsung masuk ke Sentral Buronan PUSSIBERAD.</tspan>
        <tspan x="0" dy="22">• Perlindungan terkoordinasi antar-Kodam: Serangan di satu pangkalan memperkuat benteng seluruh nusantara.</tspan>
      </text>
    </g>
  </g>

  <!-- BOTTOM GRAND CALL-TO-ACTION BANNER -->
  <g transform="translate(100, 750)">
    <rect width="1720" height="170" rx="14" fill="url(#ctaGrad)" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="1720" height="170" rx="14" fill="#000000" fill-opacity="0.2"/>

    <g transform="translate(50, 42)">
      <text x="0" y="24" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="900" fill="#a7f3d0" letter-spacing="2">
        KOMITMEN OPERASIONAL PUSSIBERAD TNI AD × CODEPOLITAN
      </text>
      <text x="0" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="900" fill="#ffffff" letter-spacing="1">
        SIAP DIGELAR DI SELURUH SATUAN KODAM, KOREM, DAN KODIM SE-INDONESIA
      </text>
      <text x="0" y="90" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e6fffa">
        Dari Sabang sampai Merauke: Menjaga Kedaulatan Ruang Siber Militer dengan Pertahanan Aktif yang Teruji dan Tangguh.
      </text>
    </g>

    <!-- Right Side Emblem / Stamp Badge -->
    <g transform="translate(1480, 35)">
      <rect width="190" height="100" rx="10" fill="#042f1d" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5"/>
      <text x="95" y="40" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#34d399" text-anchor="middle" letter-spacing="1">STATUS SISTEM</text>
      <text x="95" y="68" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">SIAP GELAR 100%</text>
      <text x="95" y="85" font-family="'Segoe UI', sans-serif" font-size="9" fill="#a7f3d0" text-anchor="middle">MILITARY GRADE C4ISR</text>
    </g>
  </g>

  <!-- Slide Footer Navigation Indicator -->
  <g transform="translate(100, 970)">
    <text x="0" y="15" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
      KCH-2026 // PUSSIBERAD TNI AD × CODEPOLITAN
    </text>
    <text x="1720" y="15" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">
      SLIDE 07 / 07
    </text>
  </g>
</svg>