<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080e"/>
      <stop offset="50%" stop-color="#09101a"/>
      <stop offset="100%" stop-color="#060a12"/>
    </linearGradient>
    <linearGradient id="card5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg5)"/>

  <!-- Tactical Grid -->
  <g opacity="0.05" stroke="#38bdf8" stroke-width="1">
    <path d="M 0 120 L 1920 120 M 0 240 L 1920 240 M 0 360 L 1920 360 M 0 480 L 1920 480 M 0 600 L 1920 600 M 0 720 L 1920 720 M 0 840 L 1920 840 M 0 960 L 1920 960"/>
    <path d="M 240 0 L 240 1080 M 480 0 L 480 1080 M 720 0 L 720 1080 M 960 0 L 960 1080 M 1200 0 L 1200 1080 M 1440 0 L 1440 1080 M 1680 0 L 1680 1080"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="900" fill="#f59e0b" text-anchor="middle">⚔</text>
    <text x="64" y="20" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="2">
      SKENARIO DEMO // PUSSIBERAD TNI AD
    </text>
    <text x="64" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="900" fill="#f8fafc" letter-spacing="0.5">
      Koreografi Live Demo 3 Menit: Meja Komando vs Terminal Musuh
    </text>
    <text x="64" y="82" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" fill="#94a3b8">
      Pembuktian Langsung: Dari Probe Awal, Pembekuan Scanner, Jebakan Dokumen Rahasia, Hingga Karantina 1-Klik
    </text>
  </g>

  <!-- TWO SPLIT-SCREEN OPERATIONAL COLUMNS -->

  <!-- LEFT COLUMN: MEJA KOMANDO PUSSIBERAD (C4ISR WAR-ROOM) -->
  <g transform="translate(100, 190)">
    <rect width="830" height="730" rx="14" fill="url(#card5)" stroke="#10b981" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect x="0" y="0" width="830" height="6" rx="3" fill="#10b981"/>

    <g transform="translate(30, 30)">
      <!-- Panel Header -->
      <rect x="0" y="0" width="300" height="28" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
      <text x="150" y="19" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="800" fill="#6ee7b7" text-anchor="middle" letter-spacing="1">
        LAYAR KIRI: MEJA KOMANDO C4ISR
      </text>

      <text x="0" y="60" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="800" fill="#f8fafc">
