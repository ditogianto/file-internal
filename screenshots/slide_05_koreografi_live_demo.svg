        </text>
        <text x="52" y="84" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
          • Graf koneksi menunjukkan TCP Window 1-byte, socket lawan dikuras habis!
        </text>
      </g>

      <!-- Step 4: Menit 02:45 - Red Alert & POMAD Seal -->
      <g transform="translate(0, 515)">
        <rect width="770" height="135" rx="8" fill="#1b090e" stroke="#ef4444" stroke-width="1"/>
        <circle cx="28" cy="30" r="12" fill="#ef4444"/>
        <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">04</text>
        <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#ef4444">
          MENIT 02:45 — SIAGA MERAH: CANARY TERPICU &amp; KARANTINA
        </text>
        <text x="52" y="62" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">
          • Suar dokumen meledak di internet luar: Dossier intelijen lengkap diterbitkan.
        </text>
        <text x="52" y="84" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">
          • Komandan menekan tombol "ISOLASI JARINGAN" — host musuh terputus seketika.
        </text>
        <text x="52" y="106" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
          • Laporan Situasi Militer (SITREP) terbit otomatis bersegel kriptografi SHA-256.
        </text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: TERMINAL PENYERANG (WSL / KALI LINUX) -->
  <g transform="translate(990, 190)">
    <rect width="830" height="730" rx="14" fill="url(#termGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow5)"/>
    <rect x="0" y="0" width="830" height="6" rx="3" fill="#64748b"/>

    <g transform="translate(30, 30)">
      <!-- Panel Header -->
      <rect x="0" y="0" width="300" height="28" rx="4" fill="#334155" fill-opacity="0.3" stroke="#64748b" stroke-width="1"/>
      <text x="150" y="19" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="1">
