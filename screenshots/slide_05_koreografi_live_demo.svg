        <rect width="770" height="535" rx="8" fill="#05080f" stroke="#1e293b" stroke-width="1.2"/>

        <!-- Terminal Title Bar -->
        <rect width="770" height="32" rx="8" fill="#0f172a"/>
        <circle cx="20" cy="16" r="5" fill="#ef4444"/>
        <circle cx="36" cy="16" r="5" fill="#f59e0b"/>
        <circle cx="52" cy="16" r="5" fill="#10b981"/>
        <text x="75" y="20" font-family="'Courier New', monospace" font-size="11" fill="#64748b">
          root@kali-offensive:~# target: 192.168.1.9 (NEXUS INTRANET)
        </text>

        <!-- Terminal Output Text -->
        <g transform="translate(20, 56)">
          <text font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#e2e8f0">
            <!-- Command 1 -->
            <tspan x="0" dy="0" fill="#10b981">root@kali:~# </tspan>
            <tspan fill="#f8fafc">nmap -sS -p 502,5020 192.168.1.9</tspan>
            <tspan x="0" dy="18" fill="#94a3b8">PORT     STATE SERVICE REASON</tspan>
            <tspan x="0" dy="16" fill="#38bdf8">502/tcp  OPEN  modbus  syn-ack (Schneider Premium PLC)</tspan>
            <tspan x="0" dy="16" fill="#10b981">[+] Modbus Decoy Responded! (Meja Komando Berbunyi Sirene!)</tspan>

            <!-- Command 2 -->
            <tspan x="0" dy="28" fill="#10b981">root@kali:~# </tspan>
            <tspan fill="#f8fafc">gobuster dir -u http://192.168.1.9:8000/scada -w /usr/share/wordlists/dirb/common.txt</tspan>
            <tspan x="0" dy="18" fill="#f59e0b">[-] TARPIT DETECTED: TCP Window constrained to 1 byte...</tspan>
            <tspan x="0" dy="16" fill="#ef4444">[-] Progress: [0/4614] 0.00% | Speed: 0 req/sec [CRASHED / FROZEN]</tspan>
            <tspan x="0" dy="16" fill="#94a3b8">[!] Terminal penyerang hang total, tidak ada respon hingga timeout!</tspan>

            <!-- Command 3 -->
            <tspan x="0" dy="28" fill="#10b981">root@kali:~# </tspan>
            <tspan fill="#f8fafc">curl -O http://192.168.1.9:8000/download/SURAT-RAHASIA-DISPENAD-2026.docx</tspan>
            <tspan x="0" dy="18" fill="#38bdf8">100% 48.2KB downloaded in 0.02s [Attacker merasa berhasil mencuri data]</tspan>

            <!-- Command 4 -->
            <tspan x="0" dy="28" fill="#10b981">root@kali:~# </tspan>
            <tspan fill="#f8fafc">xdg-open SURAT-RAHASIA-DISPENAD-2026.docx &amp; (Simulasi Buka Dokumen)</tspan>
            <tspan x="0" dy="18" fill="#ef4444">[*] CANARY BEACON DETONATED OUT-OF-BAND!</tspan>
            <tspan x="0" dy="16" fill="#fca5a5">[!] IP Publik Penyerang, ISP, dan JA4 Hash dikirim ke PUSSIBERAD</tspan>
            <tspan x="0" dy="16" fill="#ef4444">[!] KONEKSI DIPUTUS: Host attacker di-karantina oleh Komandan!</tspan>

            <!-- Final Status Line -->
            <tspan x="0" dy="30" fill="#38bdf8">------------------------------------------------------------</tspan>
            <tspan x="0" dy="18" fill="#10b981">HASIL DEMO: Serangan musuh 100% dipatahkan dalam 3 menit.</tspan>
            <tspan x="0" dy="16" fill="#94a3b8">Buktian nyata: Tidak ada rekayasa, 100% operasional on-premise.</tspan>
          </text>
        </g>
      </g>
    </g>
