  <!-- Slide Footer Navigation Indicator -->
  <g transform="translate(100, 970)">
    <text x="0" y="15" font-family="'Segoe UI', sans-serif" font-size="12" fill="#64748b">
      KCH-2026 // PUSSIBERAD TNI AD × CODEPOLITAN
    </text>
    <text x="1720" y="15" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#64748b" text-anchor="end">
