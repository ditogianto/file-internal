        </text>
        <text x="52" y="84" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
          • Node genset di radar berubah KUNING BERKEDIP, IP musuh langsung terkunci.
        </text>
      </g>

      <!-- Step 3: Menit 02:00 - Tarpit Engaged -->
      <g transform="translate(0, 380)">
        <rect width="770" height="115" rx="8" fill="#081720" stroke="#06b6d4" stroke-width="1"/>
        <circle cx="28" cy="30" r="12" fill="#06b6d4"/>
        <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#083344" text-anchor="middle">03</text>
        <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#06b6d4">
          MENIT 02:00 — TARPIT INTERDICTION (SERANGAN BALIK)
        </text>
        <text x="52" y="62" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">
