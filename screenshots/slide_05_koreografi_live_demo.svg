      </text>
      <text x="0" y="84" font-family="'Segoe UI', sans-serif" font-size="13" fill="#94a3b8">
        Diproyeksikan di Layar Utama War-Room (Resolusi 1080p, Real-Time Audio Siren)
      </text>

      <!-- Step 1: Menit 00:00 - Baseline -->
      <g transform="translate(0, 115)">
        <rect width="770" height="110" rx="8" fill="#081410" stroke="#10b981" stroke-width="1"/>
        <circle cx="28" cy="30" r="12" fill="#10b981"/>
        <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#042f1d" text-anchor="middle">01</text>
        <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#10b981">
          MENIT 00:00 — STATUS SIAGA HIJAU (BASELINE AMAN)
        </text>
        <text x="52" y="62" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">
          • Topologi aktif menampilkan 64 umpan OT/IT pangkalan dalam status monitor pasif.
        </text>
        <text x="52" y="84" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#94a3b8">
          • Nir-beban CPU (&lt;0.5%), log bersih, radar pangkalan beroperasi normal.
        </text>
      </g>

      <!-- Step 2: Menit 01:00 - Modbus Interception -->
      <g transform="translate(0, 245)">
        <rect width="770" height="115" rx="8" fill="#1f1807" stroke="#f59e0b" stroke-width="1"/>
        <circle cx="28" cy="30" r="12" fill="#f59e0b"/>
        <text x="28" y="34" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="900" fill="#451a03" text-anchor="middle">02</text>
        <text x="52" y="34" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800" fill="#f59e0b">
          MENIT 01:00 — STATUS SIAGA KUNING (LONCENG BERBUNYI)
        </text>
        <text x="52" y="62" font-family="'Segoe UI', sans-serif" font-size="12.5" fill="#cbd5e1">
