<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS-TRAP // Executive Presentation Deck (KCH-2026)</title>
  <style>
    :root {
      --bg-dark: #05080e;
      --card-bg: #0f172a;
      --accent-green: #10b981;
      --accent-cyan: #06b6d4;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      color: #f8fafc;
    }

    /* Presentation Stage Container */
    #deck-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: calc(100vh - 54px);
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-dark);
    }

    .slide {
      display: none;
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: calc(100vh - 54px);
      object-fit: contain;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      animation: fadeIn 0.25s ease-out;
    }

    .slide.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0.6; transform: scale(0.995); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Control HUD Bar */
    #hud-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 54px;
      background: #090e17;
      border-top: 1px solid #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 100;
    }

    .hud-left, .hud-center, .hud-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .hud-logo {
      font-weight: 900;
      font-size: 14px;
      letter-spacing: 1.5px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .hud-tag {
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 4px;
      color: var(--accent-green);
      font-weight: 700;
    }

    .nav-btn {
      background: #0f172a;
      border: 1px solid #334155;
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      background: #1e293b;
      color: #f8fafc;
      border-color: #64748b;
    }

    .nav-btn:active {
      transform: translateY(1px);
    }

    .slide-counter {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e2e8f0;
      min-width: 90px;
      text-align: center;
    }

    .slide-title-indicator {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent-cyan);
      max-width: 480px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .quick-link {
      color: #94a3b8;
      font-size: 12px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 4px;
      transition: background 0.15s;
    }

    .quick-link:hover {
      background: #1e293b;
      color: var(--accent-green);
    }

    /* Thumbnail Quick Select Drawer (Hidden by default) */
    #drawer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(5, 8, 14, 0.95);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      flex-direction: column;
      padding: 40px;
      box-sizing: border-box;
    }

    #drawer.open {
      display: flex;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .drawer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      overflow-y: auto;
      flex: 1;
      padding-bottom: 20px;
    }

    .drawer-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-card:hover {
      border-color: var(--accent-green);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.2);
    }

    .drawer-card img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    .drawer-card .title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
    }

    .drawer-card .subtitle {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <!-- Slide Stage -->
  <div id="deck-container">
    <img id="slide-1" class="slide active" src="screenshots/slide_01_cover.svg" alt="Slide 01 - Cover">
    <img id="slide-2" class="slide" src="screenshots/slide_02_paradoks_pondasi.svg" alt="Slide 02 - Paradoks Perimeter">
    <img id="slide-3" class="slide" src="screenshots/slide_03_filosofi_lonceng_stempel.svg" alt="Slide 03 - Filosofi Lonceng & Stempel">
    <img id="slide-4" class="slide" src="screenshots/slide_04_arsitektur_4_pilar.svg" alt="Slide 04 - Arsitektur 4 Pilar">
    <img id="slide-5" class="slide" src="screenshots/slide_05_koreografi_live_demo.svg" alt="Slide 05 - Koreografi Live Demo">
    <img id="slide-6" class="slide" src="screenshots/slide_06_purwarupa_c4isr_sitrep.svg" alt="Slide 06 - Purwarupa C4ISR & Sitrep">
    <img id="slide-7" class="slide" src="screenshots/slide_07_kesimpulan_kedaulatan.svg" alt="Slide 07 - Kesimpulan & Kedaulatan">
  </div>

  <!-- HUD Control Bar -->
  <div id="hud-bar">
    <div class="hud-left">
      <div class="hud-logo">
        <span>★ NEXUS-TRAP</span>
      </div>
      <div class="hud-tag">PUSSIBERAD × KCH 2026</div>
      <button class="nav-btn" onclick="toggleDrawer()">📑 SLIDES OVERVIEW</button>
    </div>

    <div class="hud-center">
      <button class="nav-btn" onclick="prevSlide()">◀ PREV</button>
      <div class="slide-counter" id="counter">SLIDE 01 / 07</div>
      <button class="nav-btn" onclick="nextSlide()">NEXT ▶</button>
      <div class="slide-title-indicator" id="slide-title">Cover: Platform Pertahanan Siber Aktif & Kontra-Spionase</div>
    </div>

    <div class="hud-right">
      <a href="http://localhost:3000" target="_blank" class="quick-link">⚡ LIVE WAR-ROOM</a>
      <a href="http://localhost:8000/canary-qr" target="_blank" class="quick-link">📱 QR DEMO JURI</a>
      <button class="nav-btn" onclick="toggleFullscreen()">⛶ FULLSCREEN (F11)</button>
    </div>
  </div>

  <!-- Drawer Overview -->
  <div id="drawer" onclick="if(event.target === this) toggleDrawer()">
    <div class="drawer-header">
      <h2 style="font-size: 20px; font-weight: 800; color: #f8fafc;">📑 Overview Presentasi NEXUS-TRAP (7 Slide)</h2>
      <button class="nav-btn" onclick="toggleDrawer()">✕ TUTUP</button>
    </div>
    <div class="drawer-grid" id="drawer-grid">
      <!-- Injected via JavaScript -->
    </div>
  </div>

  <script>
    const slidesData = [
      { num: 1, title: "Cover & Visi Strategis", desc: "NEXUS-TRAP: Platform Deception & Tarpit Aktif TNI AD", file: "screenshots/slide_01.png" },
      { num: 2, title: "Paradoks Perimeter & Pondasi", desc: "Ilusi Gedung Mewah vs Bahaya 'Hari Sial' Human Error & Spionase", file: "screenshots/slide_02.png" },
      { num: 3, title: "Filosofi Lonceng & Stempel", desc: "Tripwire Asimetris, Digital Dye-Pack, Doktrin Stratagem 25 & Sentral Blacklist", file: "screenshots/slide_03.png" },
      { num: 4, title: "Arsitektur 4 Pilar", desc: "OT Decoy, Sticky Tarpit, Canary OpenXML & Karantina Host 1-Klik", file: "screenshots/slide_04.png" },
      { num: 5, title: "Koreografi Live Demo 3 Menit", desc: "Split-Screen: Meja Komando C4ISR vs Terminal Penyerang (Kali Linux)", file: "screenshots/slide_05.png" },
      { num: 6, title: "Purwarupa C4ISR & Sitrep SHA", desc: "Visual Meja Komando Siaga Merah & Dokumen Hukum POMAD Bersegel SHA-256", file: "screenshots/slide_06.png" },
      { num: 7, title: "Kesimpulan & Kedaulatan Air-Gap", desc: "100% On-Premise Nir-Cloud, Efisiensi APBN, Siap Digelar di Seluruh Kodim", file: "screenshots/slide_07.png" }
    ];

    let currentSlide = 1;
    const totalSlides = slidesData.length;

    function showSlide(index) {
      if (index < 1) index = 1;
      if (index > totalSlides) index = totalSlides;
      currentSlide = index;

      for (let i = 1; i <= totalSlides; i++) {
        const el = document.getElementById(`slide-${i}`);
        if (el) {
          if (i === currentSlide) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      }

      const counter = document.getElementById('counter');
      const title = document.getElementById('slide-title');
      const numStr = currentSlide < 10 ? '0' + currentSlide : currentSlide;
      counter.innerText = `SLIDE ${numStr} / 0${totalSlides}`;
      title.innerText = `${slidesData[currentSlide - 1].title}: ${slidesData[currentSlide - 1].desc}`;
    }

    function prevSlide() {
      if (currentSlide > 1) {
        showSlide(currentSlide - 1);
      }
    }

    function nextSlide() {
      if (currentSlide < totalSlides) {
        showSlide(currentSlide + 1);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function toggleDrawer() {
      const drawer = document.getElementById('drawer');
      drawer.classList.toggle('open');
    }

    // Keyboard navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'Backspace' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        showSlide(1);
      } else if (e.key === 'End') {
        e.preventDefault();
        showSlide(totalSlides);
      } else if (e.key.toLowerCase() === 'f' && !e.ctrlKey) {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 'Escape') {
        const drawer = document.getElementById('drawer');
        if (drawer.classList.contains('open')) {
          drawer.classList.remove('open');
        }
      }
    });

    // Populate drawer grid
    const grid = document.getElementById('drawer-grid');
    slidesData.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'drawer-card';
      card.onclick = () => {
        showSlide(s.num);
        toggleDrawer();
      };
      card.innerHTML = `
        <img src="${s.file}" alt="${s.title}">
        <div class="title">SLIDE 0${s.num} // ${s.title}</div>
        <div class="subtitle">${s.desc}</div>
      `;
      grid.appendChild(card);
    });

    showSlide(1);
  </script>
</body>
</html>
